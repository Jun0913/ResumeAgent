services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Resume Agent Platform
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LLM_PROVIDER: mock
      LLM_API_KEY: ""
      LLM_MODEL: mock-resume-agent
      DATABASE_PATH: /app/data/resume_agent.db
      OUTPUTS_DIR: /app/outputs
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
